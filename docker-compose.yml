services:
  forgerouter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forgerouter
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://proxyrouter_user:${POSTGRES_PASSWORD}@forgerouter_postgres:5432/forgerouter
      POSTGRES_HOST: forgerouter_postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: forgerouter
    ports:
      - "127.0.0.1:2100:2100"
    volumes:
      # Codex CLI login (read-only): the OpenAI Codex plan handler resolves its
      # OAuth token from here automatically — no token is stored in the registry.
      - ~/.codex:/root/.codex:ro
      # Antigravity (agy) CLI login (read-only): the Google Antigravity plan
      # handler resolves its OAuth token and executes agy directly.
      - ~/.gemini:/root/.gemini:ro
      - ~/.local/bin/agy:/usr/local/bin/agy:ro
      # Claude Code CLI login (read-only, single file — avoids exposing the
      # CLI's conversation history/session data): the Claude Code plan
      # handler resolves its OAuth token from here automatically.
      - ~/.claude/.credentials.json:/root/.claude/.credentials.json:ro
      # Z.ai approved login/CLI token (read-only): the Z.ai plan handler resolves
      # its OAuth/session access token from ~/.zai/auth.json when present.
      - ~/.zai:/root/.zai:ro
      # DeepSeek web credentials/token (read-only): the native subscription
      # handler reads ~/.deepseek/auth.json when present.
      - ~/.deepseek:/root/.deepseek:ro
      # xAI Grok OAuth token (read-write, unlike the other OAuth mounts above):
      # there is no external CLI keeping this one fresh — app/providers/xai_grok.py
      # refreshes it itself and rewrites ~/.xai/auth.json in place, so the
      # container needs write access for the refresh to persist across restarts.
      - ~/.xai:/root/.xai
      # Reference-cost pricing catalogs (read-write): POST /admin/pricing/sync
      # rewrites these from inside the container (app/pricing.py). Without a
      # bind mount here the sync result only lives in the container's writable
      # layer and is lost on the next --build/recreate — mount them so a sync
      # actually persists across deploys, the same way the repo file does.
      - ./config/model_pricing.json:/app/config/model_pricing.json
      - ./config/model_pricing_live.json:/app/config/model_pricing_live.json
      - ./config/model_pricing_overrides.json:/app/config/model_pricing_overrides.json
      # --- Agent deploy-config (read-write): lets POST /admin/agents/{name}/rotate-key
      # write the freshly rotated key straight into the agent's own runtime config
      # (db/036_agent_deploy_config.sql: agents.config_path/config_format/config_key),
      # instead of leaving the agent silently stuck on a stale key until someone
      # notices — see the Scriba/Athos key-mixup incident, 2026-07-23. Each mount
      # below is deliberately scoped to exactly the file the deploy-config write
      # touches, not the whole profile directory. The ~/.codex and ~/.gemini
      # entries above stay read-only for OAuth token safety; the .env mount for
      # each is a more specific nested bind that overrides just that one file.
      - ~/.hermes/profiles:/root/.hermes/profiles
      - ~/.claude/.env:/root/.claude/.env
      - ~/.codex/.env:/root/.codex/.env
      - ~/.gemini/config/.env:/root/.gemini/config/.env
      - ~/.openclaw/.env:/root/.openclaw/.env
      # --- systemd/D-Bus client sockets (read-write; matched by `pid: host` below):
      # required for `systemctl restart <unit>` run inside the container to reach
      # the HOST's systemd instance and actually restart an agent's gateway after
      # its config is rewritten. Verified empirically 2026-07-23: the D-Bus
      # handshake fails ("Failed to connect to bus") without pid: host, even with
      # these sockets mounted — systemd authenticates over peer credentials that
      # require the same PID namespace.
      - /run/systemd:/run/systemd
      - /run/dbus:/run/dbus
    pid: host
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2100/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - foundation_network

networks:
  foundation_network:
    external: true
